[project]
name = "nutriscope"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "psutil==7.2.2; sys_platform == 'win32'",
    "pyarrow==25.0.0",
    "scipy==1.18.1",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.6",
    "pre-commit==4.7.0",
    "mypy>=2.4.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
